# Publishes a release of the theme when a version tag is pushed:
#
#   1. bump "Version:" in themes/upsimply/style.css and commit it
#   2. git tag v1.2.3 && git push origin v1.2.3
#
# The release carries the repository at the tagged commit as a tarball shaped
# like GitHub's own (one top-level directory), its SHA-256, and a build
# provenance attestation tying the tarball to this workflow and commit.
#
# Publishing reaches sites: the panel reads the newest release from GitHub,
# checks its tarball against the published checksum, installs it on new sites
# and offers it to the others as a reviewed update.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  release:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag against the theme's version
        run: |
          version="$(sed -n 's/^Version:[[:space:]]*//p' themes/upsimply/style.css | tr -d '\r')"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error file=themes/upsimply/style.css::Tag $GITHUB_REF_NAME does not match the theme's Version $version."
            exit 1
          fi

      - name: Package the release
        run: |
          name="wp-simply-${GITHUB_REF_NAME}"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" "$GITHUB_SHA"
          sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256"
          echo "ARCHIVE=${name}.tar.gz" >> "$GITHUB_ENV"

      # The manifest the theme's updater reads (themes/upsimply/inc/updater.php),
      # in the shape WordPress.org gives a theme update. Published on every
      # release, so .../releases/latest/download/update.json always names the
      # newest one. It carries no package: WordPress announces the update and
      # the hosting panel applies it.
      - name: Write the update manifest
        run: |
          header() { sed -n "s/^$1:[[:space:]]*//p" themes/upsimply/style.css | tr -d '\r'; }
          jq -n \
            --arg version "${GITHUB_REF_NAME#v}" \
            --arg url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/${GITHUB_REF_NAME}" \
            --arg requires "$(header 'Requires at least')" \
            --arg requires_php "$(header 'Requires PHP')" \
            '{theme: "upsimply", new_version: $version, url: $url, package: "", requires: $requires, requires_php: $requires_php}' \
            > update.json
          cat update.json

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # A release drafted in GitHub's interface creates the tag, which is what
        # runs this, so the release may already be there: it is given the
        # assets then. An asset already on it is never replaced (no
        # --clobber): the panel records a release's checksum once, and a
        # tarball swapped afterwards is one it refuses.
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" update.json
          else
            gh release create "$GITHUB_REF_NAME" "$ARCHIVE" "$ARCHIVE.sha256" update.json \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
